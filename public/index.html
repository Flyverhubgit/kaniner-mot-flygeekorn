<!DOCTYPE html>
<html lang="no">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Kaniner mot Flygeekorn</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #000; font-family: sans-serif; }
  /* Mobil: ingen zoom, rulling eller tekstmarkering når man trykker fort */
  body { -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; overscroll-behavior: none; }
  body.playing { touch-action: none; }
  #nameInput { -webkit-user-select: text; user-select: text; }
  /* Under skummet: rosa og uklart */
  #foamview { position: fixed; inset: 0; pointer-events: none; z-index: 2; background: rgba(255,150,205,0.6); -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px); display: none; }
  /* Mobil på høykant: be om å snu telefonen */
  #rotate { position: fixed; inset: 0; z-index: 30; background: #2b3a47; color: #fff; display: none; align-items: center; justify-content: center; text-align: center; font: bold 22px sans-serif; padding: 30px; }
  @media (orientation: portrait) and (pointer: coarse) { body.playing #rotate { display: flex; } }
  /* Kikkertsikte: svart rundt, klart hull i midten, tynne trådkors */
  #scope { position: fixed; inset: 0; pointer-events: none; z-index: 3; display: none;
    background: radial-gradient(circle at center, transparent 0, transparent 38vmin, rgba(0,0,0,0.92) 38.5vmin); }
  #scope::before, #scope::after { content: ''; position: absolute; background: rgba(0,0,0,0.85); }
  #scope::before { left: 50%; top: 12vh; bottom: 12vh; width: 2px; margin-left: -1px; }
  #scope::after { top: 50%; left: calc(50% - 38vmin); right: calc(50% - 38vmin); height: 2px; margin-top: -1px; }
  /* Drap på rad: stort banner øverst */
  #streak { position: fixed; left: 50%; top: 22%; transform: translate(-50%, -50%) scale(1); color: #ffe14a; font: 900 40px sans-serif; text-shadow: 0 0 10px #000, 0 3px 0 #b33; z-index: 6; pointer-events: none; text-align: center; opacity: 0; transition: opacity 0.3s, transform 0.3s; white-space: nowrap; }
  #streak.show { opacity: 1; transform: translate(-50%, -50%) scale(1.1); }
  #streak small { display: block; font-size: 20px; color: #fff; }
  /* Treff-retning: rød kile ved kanten av skjermen som peker mot den som skjøt */
  #hitdir { position: fixed; left: 50%; top: 50%; width: 0; height: 0; z-index: 3; pointer-events: none; opacity: 0; }
  #hitdir div { position: absolute; left: -40px; top: -42vmin; width: 80px; height: 26px; background: radial-gradient(ellipse at center bottom, rgba(255,40,40,0.95), rgba(255,40,40,0) 70%); border-radius: 50% 50% 0 0; }
  /* Lag som trenger spillere */
  .card .need { display: none; font-size: 13px; font-weight: bold; color: #222; background: #f2c14e; border-radius: 10px; padding: 2px 8px; margin: 4px auto 0; width: fit-content; }
  .card.needs .need { display: block; }
  /* QR-kode for å dele spillet */
  #qrBox { display: flex; align-items: center; gap: 12px; background: rgba(0,0,0,0.3); padding: 10px 14px; border-radius: 12px; font-size: 14px; }
  #qrImg { width: 110px; height: 110px; background: #fff; border-radius: 6px; image-rendering: pixelated; }
  #qrLink { font-size: 12px; opacity: 0.8; word-break: break-all; }
  #sensRow { font-size: 14px; display: flex; align-items: center; gap: 10px; }
  canvas { display: block; }
  #crosshair { position: fixed; left: 50%; top: 50%; width: 6px; height: 6px; margin: -3px 0 0 -3px; border-radius: 50%; background: #fff; box-shadow: 0 0 0 1px #000; pointer-events: none; z-index: 3; }
  #hitmarker { position: fixed; left: 50%; top: 50%; width: 26px; height: 26px; margin: -13px 0 0 -13px; pointer-events: none; z-index: 3; opacity: 0; transition: opacity 0.15s; }
  #hitmarker::before, #hitmarker::after { content: ''; position: absolute; left: 12px; top: -2px; width: 2px; height: 30px; background: #fff; }
  #hitmarker::before { transform: rotate(45deg); }
  #hitmarker::after { transform: rotate(-45deg); }
  #hitmarker.kill::before, #hitmarker.kill::after { background: #ff3b30; }
  #overlay { position: fixed; inset: 0; display: none; align-items: center; justify-content: center; text-align: center; background: rgba(0,0,0,0.55); color: #fff; font: 18px/1.6 sans-serif; cursor: pointer; z-index: 10; padding: 20px; }

  /* Lag-valg */
  #menu { position: fixed; inset: 0; z-index: 20; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px; background: linear-gradient(#5d7a93, #2b3a47); color: #fff; padding: 16px; box-sizing: border-box; overflow-y: auto; }
  /* [FIKS] Sentrert innhold som er høyere enn skjermen ble kuttet øverst (kunne ikke rulles til).
     Nå: start øverst, med automatisk luft over og under, så det er sentrert når det er plass. */
  #menu { justify-content: flex-start; }
  #menu > :first-child { margin-top: auto; }
  #menu > :last-child { margin-bottom: auto; }
  #menu h1 { margin: 0; font-size: 34px; letter-spacing: 1px; text-shadow: 0 3px 0 #000; text-align: center; }
  #menu h1 .b { color: #ff6b5e; } #menu h1 .s { color: #a5d65a; }
  #nameInput { font-size: 20px; padding: 8px 12px; border-radius: 8px; border: 2px solid #fff; background: rgba(0,0,0,0.3); color: #fff; text-align: center; width: 240px; }
  #cards { display: flex; gap: 20px; flex-wrap: wrap; justify-content: center; }
  .card { width: 240px; border-radius: 14px; background: rgba(0,0,0,0.35); border: 4px solid transparent; cursor: pointer; text-align: center; padding-bottom: 10px; transition: transform 0.1s; user-select: none; }
  .card:hover { transform: scale(1.03); }
  .card.selected.bunny { border-color: #d23b2f; background: rgba(210,59,47,0.25); }
  .card.selected.squirrel { border-color: #6b8e23; background: rgba(107,142,35,0.3); }
  .card canvas { width: 240px; height: 260px; border-radius: 10px 10px 0 0; }
  .card .t { font-size: 22px; font-weight: bold; }
  .card .c { font-size: 14px; opacity: 0.8; }
  .card .p { font-size: 14px; color: #f2c14e; margin: 2px 0; }
  #joinBtn { font-size: 22px; font-weight: bold; padding: 12px 40px; border-radius: 10px; border: none; background: #f2c14e; color: #222; cursor: pointer; }
  #joinBtn:disabled { opacity: 0.4; cursor: default; }
  #status { font-size: 14px; opacity: 0.8; min-height: 18px; }

  /* HUD */
  #topbar { position: fixed; left: 50%; top: 10px; transform: translateX(-50%); color: #fff; font: bold 22px sans-serif; text-shadow: 0 0 4px #000; z-index: 4; pointer-events: none; white-space: nowrap; display: none; }
  #topbar .b { color: #ff6b5e; } #topbar .s { color: #a5d65a; }
  #health { position: fixed; left: 20px; bottom: 20px; color: #fff; font: bold 26px sans-serif; text-shadow: 0 0 4px #000; z-index: 4; pointer-events: none; display: none; }
  #killfeed { position: fixed; left: 15px; top: 12px; color: #fff; font: bold 15px sans-serif; text-shadow: 0 0 3px #000; z-index: 4; pointer-events: none; }
  #killfeed div { margin-bottom: 4px; background: rgba(0,0,0,0.35); padding: 3px 8px; border-radius: 4px; }
  #killfeed .b { color: #ff6b5e; } #killfeed .s { color: #a5d65a; } #killfeed .n, #center .n { color: #ff9a2e; }
  #damage { position: fixed; inset: 0; pointer-events: none; z-index: 2; box-shadow: inset 0 0 120px rgba(255,0,0,0.8); opacity: 0; }
  #center { position: fixed; left: 50%; top: 38%; transform: translate(-50%, -50%); color: #fff; font: bold 30px sans-serif; text-shadow: 0 0 6px #000; text-align: center; z-index: 6; pointer-events: none; display: none; }
  #scoreboard { position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%); background: rgba(0,0,0,0.75); color: #fff; padding: 16px 22px; border-radius: 10px; z-index: 7; display: none; font: 16px sans-serif; min-width: 420px; }
  #scoreboard table { width: 100%; border-collapse: collapse; }
  #scoreboard td, #scoreboard th { padding: 4px 8px; text-align: left; }
  #scoreboard .me { background: rgba(255,255,255,0.15); }
  /* Lav skjerm (mobil på tvers): mindre kort og tettere */
  @media (max-height: 520px) {
    #menu { gap: 8px; padding: 8px; }
    #menu h1 { font-size: 24px; }
    #nameInput { font-size: 16px; padding: 5px 10px; }
    .card { width: 170px; padding-bottom: 6px; }
    .card canvas { width: 170px; height: 184px; }
    .card .t { font-size: 18px; }
    #joinBtn { font-size: 18px; padding: 8px 30px; }
    #qrImg { width: 80px; height: 80px; }
  }
</style>
</head>
<body>
<div id="crosshair"></div>
<div id="hitmarker"></div>
<div id="overlay"></div>
<div id="damage"></div>
<div id="topbar"></div>
<div id="health"></div>
<div id="killfeed"></div>
<div id="center"></div>
<div id="scoreboard"></div>
<div id="foamview"></div>
<div id="scope"></div>
<div id="streak"></div>
<div id="hitdir"><div></div></div>
<div id="rotate">&#128260;<br>Snu telefonen sideveis for å spille</div>

<div id="menu">
  <h1><span class="b">KANINER</span> mot <span class="s">FLYGEEKORN</span></h1>
  <input id="nameInput" maxlength="16" placeholder="Ditt navn">
  <div id="cards">
    <div class="card bunny" data-team="bunny">
      <canvas id="prevBunny" width="480" height="520"></canvas>
      <div class="t">Kanin</div>
      <div class="p">&#9889; Superhopp</div>
      <div class="c" id="countBunny">0 spillere</div>
      <div class="need">&#128227; Trenger spillere!</div>
    </div>
    <div class="card squirrel" data-team="squirrel">
      <canvas id="prevSquirrel" width="480" height="520"></canvas>
      <div class="t">Flygeekorn</div>
      <div class="p">&#127786; Svever (hold hopp i lufta)</div>
      <div class="c" id="countSquirrel">0 spillere</div>
      <div class="need">&#128227; Trenger spillere!</div>
    </div>
  </div>
  <div id="sensRow">Sikte-følsomhet <input id="sens" type="range" min="0.3" max="2.5" step="0.1" value="1"> <span id="sensVal">1.0</span></div>
  <button id="joinBtn" disabled>Velg et lag</button>
  <div id="status">Kobler til serveren...</div>
  <div id="qrBox">
    <img id="qrImg" alt="QR-kode til spillet">
    <div><b>Inviter venner!</b><br>Skann koden med mobilen<br><span id="qrLink"></span></div>
  </div>
</div>

<script src="vendor/three.min.js"></script>
<script src="vendor/qrcode.js"></script>
<script src="/socket.io/socket.io.js"></script>
<script src="models.js"></script>
<script src="game.js"></script>
<script src="underworld.js"></script>
<script src="room.js"></script>
</body>
</html>
